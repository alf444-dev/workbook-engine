<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dépôt — Workbook Engine</title>
<style>
  :root{
    --ink:#12211E; --pine:#1A5E52; --pine-d:#134A41; --amber:#E5A33C; --amber-d:#B87A1C;
    --paper:#EEF2F0; --card:#FFFFFF; --rule:#D8E0DC; --muted:#5D6A66; --red:#B4423A;
    --shadow:0 1px 2px rgba(18,33,30,.06), 0 8px 24px -12px rgba(18,33,30,.18);
    --f-ui:"Archivo",system-ui,sans-serif;
    --f-read:"Source Serif 4",Georgia,serif;
    --f-data:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);
       font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  header{height:60px;display:flex;align-items:center;gap:14px;padding:0 26px;
         background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
  header b{font-size:17px;letter-spacing:-.2px}
  header span{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
  main{max-width:940px;margin:0 auto;padding:34px 26px 80px}
  h1{font-family:var(--f-read);font-size:30px;font-weight:600;margin:0 0 6px;letter-spacing:-.3px}
  .lede{color:var(--muted);margin:0 0 28px;max-width:60ch}

  /* ---------- dépôt ---------- */
  .drop{background:var(--card);border:1.5px dashed var(--rule);border-radius:14px;
        padding:34px;text-align:center;transition:border-color .15s, background .15s}
  .drop.over{border-color:var(--pine);background:#F4F8F6}
  .drop h2{font-size:17px;margin:0 0 6px}
  .drop p{color:var(--muted);font-size:14px;margin:0 0 18px}
  .drop .file{font-family:var(--f-data);font-size:13px;color:var(--pine);margin-bottom:16px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  input[type=text]{font:inherit;padding:10px 13px;border:1px solid var(--rule);
                   border-radius:9px;min-width:280px;background:var(--card)}
  button{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:9px;
         padding:10px 20px;cursor:pointer;background:var(--pine);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ghost{background:#E3E9E6;color:var(--ink)}
  .err{color:var(--red);font-size:14px;margin-top:14px}

  /* ---------- progression ---------- */
  .steps{list-style:none;margin:22px 0 0;padding:0;text-align:left;
         max-width:420px;margin-inline:auto}
  .steps li{display:flex;align-items:center;gap:11px;padding:6px 0;color:var(--muted);
            font-size:14px}
  .steps .bullet{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:none}
  .steps li.done{color:var(--ink)}
  .steps li.done .bullet{background:var(--pine)}
  .steps li.now{color:var(--ink);font-weight:600}
  .steps li.now .bullet{background:var(--amber);
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- projets ---------- */
  h2.sec{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);
         margin:46px 0 14px;font-weight:700}
  .proj{background:var(--card);border-radius:14px;box-shadow:var(--shadow);
        padding:22px 24px;margin-bottom:14px}
  .proj-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .proj h3{font-family:var(--f-read);font-size:20px;font-weight:600;margin:0}
  .proj .meta{font-family:var(--f-data);font-size:11.5px;color:var(--muted);margin-left:auto}
  .tag{font-family:var(--f-data);font-size:11px;padding:2px 9px;border-radius:20px;
       background:#E3E9E6;color:var(--muted)}
  .tag.ready{background:var(--pine);color:#fff}
  .tag.running{background:var(--amber);color:#3A2A08}
  .tag.failed{background:var(--red);color:#fff}
  .links{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px;
         display:grid;gap:8px}
  .link{display:flex;align-items:center;gap:10px;font-size:14px}
  .link b{font-weight:600;min-width:130px}
  .link code{font-family:var(--f-data);font-size:11.5px;color:var(--muted);
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .link button{padding:5px 11px;font-size:12.5px;background:#E3E9E6;color:var(--ink)}
  .files{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}
  .files a{font-size:13px;text-decoration:none;color:var(--pine);font-weight:600;
           border:1px solid var(--rule);border-radius:8px;padding:6px 12px;background:var(--card)}
  .files a:hover{border-color:var(--pine)}
  .who{font-family:var(--f-data);font-size:11.5px;color:var(--muted);margin-top:12px}
  .redo{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .redo button{padding:8px 16px;font-size:13.5px}
  .redo small{color:var(--muted);font-size:12.5px}
  .drive{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         border-top:1px solid var(--rule);padding-top:14px}
  .drive b{font-weight:600;font-size:14px;min-width:130px}
  .drive input{flex:1;min-width:240px;font-size:13.5px;padding:8px 11px}
  .drive button{padding:8px 14px;font-size:13px;background:#E3E9E6;color:var(--ink)}
  .drive small{width:100%;color:var(--muted);font-size:12.5px}
  .fail{margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
  .fail p{margin:0 0 10px;font-size:14px}
  .fail > code{display:block;font-family:var(--f-data);font-size:12px;color:var(--red);
               background:#FBF2F1;border-radius:8px;padding:10px 12px;word-break:break-word}
  .fail details{margin-top:10px}
  .fail summary{font-size:13px;color:var(--muted);cursor:pointer}
  pre.log,.fail pre{font-family:var(--f-data);font-size:11px;background:#F4F6F5;padding:12px;
          border-radius:9px;overflow-x:auto;margin-top:10px;color:var(--muted);
          white-space:pre-wrap;word-break:break-all}
  .empty{color:var(--muted);font-size:14px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header><b>Workbook Engine</b><span>Dépôt des manuscrits</span></header>

<main>
  <h1>Déposer un manuscrit</h1>
  <p class="lede">Le pipeline tourne côté serveur : conversion, contrôles, livre
     mis en page, et les trois files de relecture. Comptez une dizaine de secondes.</p>

  <form class="drop" id="drop">
    <h2>Glissez le <code>.docx</code> ici</h2>
    <p>ou choisissez-le depuis votre ordinateur</p>
    <div class="file" id="chosen" hidden></div>
    <div class="row">
      <input type="file" id="file" accept=".docx" hidden>
      <button type="button" class="ghost" id="pick">Choisir un fichier</button>
      <input type="text" id="name" placeholder="Nom du projet (facultatif)">
      <button type="submit" id="go" disabled>Compiler</button>
    </div>
    <ol class="steps" id="steps" hidden></ol>
    <div class="err" id="err" hidden></div>
  </form>

  <h2 class="sec">Projets</h2>
  <div id="list"><p class="empty">Chargement…</p></div>
</main>

<script>
const ETAPES = [
  "docx → structure",
  "décisions des relecteurs",
  "typage des exercices + liaison des réponses",
  "validation linguistique",
  "contrôle des exercices et answer keys",
  "compilation du livre",
  "console de relecture",
];
const STATUT = {pending:"en attente", running:"compilation", ready:"prêt", failed:"échec"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<&]/g, c => ({'<':'&lt;','&':'&amp;'}[c]));
let fichier = null, encours = null, minuteur = null;

/* ---------- choix du fichier ---------- */
function choisir(f){
  if (!f) return;
  if (!f.name.toLowerCase().endsWith('.docx')){
    return erreur("Il faut un fichier .docx — le manuscrit Word, pas un PDF.");
  }
  fichier = f;
  $('chosen').hidden = false;
  $('chosen').textContent = `${f.name} · ${(f.size/1024/1024).toFixed(1)} Mo`;
  $('go').disabled = false;
  erreur(null);
}
$('pick').onclick = () => $('file').click();
$('file').onchange = e => choisir(e.target.files[0]);

const drop = $('drop');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => choisir(e.dataTransfer.files[0]));

function erreur(msg){
  $('err').hidden = !msg;
  $('err').textContent = msg || '';
}

/* ---------- dépôt ---------- */
drop.onsubmit = async e => {
  e.preventDefault();
  if (!fichier) return;
  $('go').disabled = true; erreur(null);
  const corps = new FormData();
  corps.append('file', fichier);
  corps.append('name', $('name').value.trim());
  try {
    const r = await fetch('projects', {method:'POST', body:corps});
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || 'échec du dépôt');
    encours = j.id;
    montrerEtapes(null);
    suivre();
  } catch (ex){
    erreur(ex.message);
    $('go').disabled = false;
  }
};

function montrerEtapes(courante){
  const ol = $('steps');
  ol.hidden = false;
  ol.innerHTML = ETAPES.map((t, i) => {
    const cls = courante == null ? (i === 0 ? 'now' : '')
              : i < courante ? 'done' : i === courante ? 'now' : '';
    return `<li class="${cls}"><span class="bullet"></span>${t}</li>`;
  }).join('');
}

/* « 3/5  validation linguistique » → index de l'étape en cours */
function indexEtape(step){
  if (!step) return 0;
  const n = parseInt(step, 10);
  return Number.isFinite(n) ? Math.min(n - 1, ETAPES.length - 1) : 0;
}

async function suivre(){
  if (!encours) return;
  const r = await fetch('projects/' + encours);
  const p = await r.json();
  if (p.status === 'running' || p.status === 'pending'){
    montrerEtapes(indexEtape(p.step));
    minuteur = setTimeout(suivre, 1200);
    return;
  }
  $('steps').hidden = true;
  $('go').disabled = false;
  if (p.status === 'failed'){
    erreur("La compilation a échoué — le détail est sur la fiche du projet.");
  }
  fichier = null; $('chosen').hidden = true; $('file').value = ''; $('name').value = '';
  encours = null;
  charger();
}

/* ---------- liste ---------- */
function fiche(p){
  const liens = p.links.map(l => `
    <div class="link"><b>${l.label}</b>
      <code>${l.url || '—'}</code>
      ${l.url ? `<button data-copy="${l.url}">Copier</button>
                 <button data-rotate="${p.id}" data-role="${l.role}"
                         title="Révoque ce lien et en émet un neuf">Renouveler</button>` : ''}
    </div>`).join('');
  const fichiers = p.has_pdf ? `
    <div class="files">
      <a href="projects/${p.id}/book.pdf">Livre (PDF)</a>
      ${p.reports.map(n => `<a href="projects/${p.id}/reports/${n}">${n}</a>`).join('')}
    </div>` : '';
  const redo = p.status === 'ready' ? `
    <div class="redo">
      <button data-recompile="${p.id}" ${p.decisions ? '' : 'disabled'}>Recompiler</button>
      <small>${p.decisions
        ? `${p.decisions} décision${p.decisions > 1 ? 's' : ''} à reporter dans le livre`
        : 'aucune décision à reporter pour l\'instant'}</small>
    </div>` : '';
  const drive = p.status === 'ready' ? `
    <div class="drive">
      <b>Dossier Drive</b>
      <input type="text" id="drive-${p.id}" value="${esc(p.drive_folder || '')}"
             placeholder="Coller le lien du dossier du projet" ${p.drive_ready ? '' : 'disabled'}>
      <button data-drive="${p.id}" ${p.drive_ready ? '' : 'disabled'}>Enregistrer</button>
      <small>${p.drive_ready
        ? esc(p.drive_state || "Le livre et les rapports y seront déposés à chaque compilation.")
        : "Dépôt Drive non configuré sur ce serveur (WB_DRIVE_CREDENTIALS absent)."}</small>
    </div>` : '';
  const relecteurs = p.decisions
    ? `<div class="who">${p.decisions} décision${p.decisions > 1 ? 's' : ''} enregistrée${p.decisions > 1 ? 's' : ''}${p.reviewers.length ? ' — ' + p.reviewers.join(', ') : ''}</div>`
    : '';
  return `<div class="proj">
    <div class="proj-head">
      <h3>${p.name}</h3>
      <span class="tag ${p.status}">${STATUT[p.status] || p.status}</span>
      <span class="meta">${p.source} · ${p.created_at.replace('T',' ').replace('Z','')}</span>
    </div>
    ${p.status === 'ready' ? `<div class="links">${liens}</div>${fichiers}${relecteurs}${redo}${drive}` : ''}
    ${p.status === 'failed' ? `
      <div class="fail">
        <p>Le pipeline s'est arrêté${p.step ? ` à l'étape « ${esc(p.step.trim())} »` : ''}.
           Le manuscrit n'a pas pu être traité tel quel.</p>
        <code>${esc(p.error || '')}</code>
        <details><summary>Détail technique</summary><pre>${esc(p.log || '')}</pre></details>
      </div>` : ''}
  </div>`;
}

async function charger(){
  const r = await fetch('projects');
  const projets = await r.json();
  $('list').innerHTML = projets.length
    ? projets.map(fiche).join('')
    : `<p class="empty">Aucun projet pour l'instant. Déposez un manuscrit ci-dessus.</p>`;
}

document.addEventListener('click', async e => {
  const c = e.target.closest('[data-copy]');
  if (c){
    navigator.clipboard.writeText(c.dataset.copy);
    const t = c.textContent; c.textContent = 'Copié'; setTimeout(() => c.textContent = t, 1200);
    return;
  }
  const rec = e.target.closest('[data-recompile]');
  if (rec){
    rec.disabled = true; rec.textContent = 'Compilation…';
    await fetch(`projects/${rec.dataset.recompile}/recompile`, {method:'POST'});
    attendre(rec.dataset.recompile);
    return;
  }
  const dr = e.target.closest('[data-drive]');
  if (dr){
    dr.disabled = true;
    const champ = document.getElementById('drive-' + dr.dataset.drive);
    const r = await fetch(`projects/${dr.dataset.drive}/drive`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({folder: champ.value.trim()})});
    if (!r.ok){
      const j = await r.json().catch(() => ({}));
      alertLigne(champ, j.detail || 'lien refusé');
      dr.disabled = false;
      return;
    }
    charger();
    return;
  }
  const rot = e.target.closest('[data-rotate]');
  if (rot){
    rot.disabled = true;
    await fetch(`projects/${rot.dataset.rotate}/rotate/${rot.dataset.role}`, {method:'POST'});
    charger();
  }
});

function alertLigne(champ, message){
  const petit = champ.closest('.drive').querySelector('small');
  petit.textContent = message;
  petit.style.color = 'var(--red)';
}

async function attendre(pid){
  const p = await (await fetch('projects/' + pid)).json();
  if (p.status === 'running' || p.status === 'pending'){
    setTimeout(() => attendre(pid), 1200);
    return;
  }
  charger();
}

charger();
</script>
</body>
</html>
