<!DOCTYPE html>
<!-- Le contenu de la console est en anglais : les relecteurs externes ne
     parlent pas forcément français. Déclarer « fr » ferait lire ce texte
     anglais avec les règles françaises par un lecteur d'écran. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- La console est aussi produite en fichier autonome (output/console.html)
     que l'équipe peut déposer quelque part : la protection ne peut pas
     reposer seulement sur l'en-tête du serveur. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Review — Workbook Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12211E; --pine:#1A5E52; --pine-d:#134A41; --amber:#E5A33C; --amber-d:#B87A1C;
    --paper:#EEF2F0; --card:#FFFFFF; --rule:#D8E0DC; --muted:#5D6A66;
    --shadow:0 1px 2px rgba(18,33,30,.06), 0 8px 24px -12px rgba(18,33,30,.18);
    --rail:64px; --head:60px;
    --f-ui:"Archivo",system-ui,sans-serif;
    --f-read:"Source Serif 4",Georgia,serif;
    --f-data:"IBM Plex Mono",ui-monospace,monospace;
    --f-cjk:"Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--f-ui);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:4px}

  /* ---------- en-tête ---------- */
  header{
    position:fixed;inset:0 0 auto 0;height:var(--head);z-index:20;
    display:flex;align-items:center;gap:22px;padding:0 22px;
    background:rgba(238,242,240,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
  }
  .brand{display:flex;align-items:baseline;gap:9px;min-width:0}
  .brand b{font-weight:800;letter-spacing:.02em}
  .brand span{font-family:var(--f-data);font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .roles{display:flex;gap:2px;margin-left:auto;background:#E3E9E6;padding:3px;border-radius:9px}
  .roles button{
    padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);
    display:flex;align-items:center;gap:7px;transition:background .15s,color .15s;
  }
  .roles button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .roles .n{font-family:var(--f-data);font-size:11px;padding:1px 6px;border-radius:20px;
    background:var(--amber);color:#3B2A08;font-weight:500}
  .roles button[aria-pressed="true"] .n{background:var(--pine);color:#fff}
  .roles .n.done{background:#CBD6D1;color:var(--muted)}
  .export{font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;
    border:1px solid var(--rule);background:var(--card);box-shadow:var(--shadow)}
  .export:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  /* ---------- rail : le livre vu par la tranche ---------- */
  .rail{
    position:fixed;top:var(--head);bottom:0;left:0;width:var(--rail);z-index:15;
    background:linear-gradient(90deg,#E3E9E6,#EEF2F0 78%);border-right:1px solid var(--rule);
    padding:16px 0 20px;display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .rail-cap{font-family:var(--f-data);font-size:9.5px;color:var(--muted);letter-spacing:.14em}
  .edge{flex:1;width:26px;display:flex;flex-direction:column;gap:2px;overflow:hidden;
    border-radius:3px;box-shadow:inset -1px 0 0 rgba(18,33,30,.09)}
  .leaf{flex:1;min-height:2px;background:#fff;box-shadow:inset 0 -1px 0 rgba(18,33,30,.05);
    position:relative;transition:background .25s}
  .leaf.flagged{background:var(--amber)}
  .leaf.cleared{background:var(--pine)}
  .leaf.here::after{content:"";position:absolute;right:-8px;top:50%;transform:translateY(-50%);
    border:5px solid transparent;border-right-color:var(--ink)}
  .rail-pct{font-family:var(--f-data);font-size:12px;font-weight:500}

  /* ---------- colonne principale ---------- */
  main{padding:calc(var(--head) + 26px) 26px 90px calc(var(--rail) + 26px);
    max-width:940px;margin:0 auto}
  .lede{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .lede h1{font-size:26px;font-weight:800;letter-spacing:-.015em;margin:0}
  .lede p{margin:0;color:var(--muted);font-size:14px;max-width:46ch}
  .stats{display:flex;gap:18px;margin-left:auto;font-family:var(--f-data);font-size:11.5px;
    color:var(--muted);text-align:right}
  .stats b{display:block;font-family:var(--f-ui);font-size:19px;font-weight:700;color:var(--ink)}

  /* ---------- fiche ---------- */
  .card{background:var(--card);border:1px solid var(--rule);border-radius:12px;
    box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;
    transition:opacity .2s,transform .2s,border-color .2s}
  .card[data-state="done"]{opacity:.42}
  .card.current{border-color:var(--pine);box-shadow:0 0 0 1px var(--pine),var(--shadow)}
  .card-top{display:flex;align-items:center;gap:10px;padding:11px 18px;
    border-bottom:1px solid var(--rule);background:#FBFCFB}
  .tag{font-family:var(--f-data);font-size:10px;letter-spacing:.1em;padding:3px 8px;
    border-radius:20px;background:#E9EFEC;color:var(--pine-d)}
  .tag.warn{background:#FCF2DF;color:var(--amber-d)}
  .where{font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .verdict{margin-left:auto;font-family:var(--f-data);font-size:11px;color:var(--pine);
    display:none;align-items:center;gap:5px}
  .card[data-state="done"] .verdict{display:flex}
  .card-body{padding:18px}

  .zh{font-family:var(--f-cjk);font-size:27px;line-height:1.3;margin:0 0 12px}
  .rows{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline;
    font-size:14px;margin-bottom:12px}
  .rows dt{font-family:var(--f-data);font-size:10.5px;letter-spacing:.09em;color:var(--muted);
    padding-top:2px}
  .rows dd{margin:0;font-family:var(--f-read)}
  .rows dd.given{font-style:italic}
  .rows dd.expected{color:var(--pine-d);font-weight:600}
  .ctx{font-family:var(--f-read);font-size:14px;color:var(--muted);
    border-left:2px solid var(--rule);padding-left:12px;margin:0 0 14px}
  .detail{font-size:14px;margin:0 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-family:var(--f-read);font-size:13px;background:#F2F5F3;border:1px solid var(--rule);
    border-radius:6px;padding:3px 9px}

  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .act{padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;
    border:1px solid var(--rule);background:var(--card);transition:background .15s,border-color .15s}
  .act:hover{background:#F3F6F4}
  .act.primary{background:var(--pine);color:#fff;border-color:var(--pine)}
  .act.primary:hover{background:var(--pine-d)}
  .act kbd{font-family:var(--f-data);font-size:10px;opacity:.6;margin-left:7px}
  .fix{display:none;gap:8px;width:100%;margin-top:10px}
  .fix.open{display:flex}
  .fix input{flex:1;font-family:var(--f-read);font-size:14px;padding:9px 12px;
    border:1px solid var(--rule);border-radius:8px;background:#FBFCFB}
  .fix input:focus{outline:none;border-color:var(--pine);background:#fff}

  /* La console n'a pas de vert clair dans sa palette : on le pose ici plutôt
     que d'emprunter une variable qui n'existe pas et de rendre un bloc sans
     fond, ce qui est exactement ce qui s'est passé. */
  .fini{background:#E4EFEB;border:1px solid #CFE0D9;border-radius:14px;
    padding:20px 24px;margin-bottom:18px}
  .fini h2{margin:0 0 6px;font-size:19px}
  .fini p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
  .perime{background:#FBF0DC;border:1px solid #EBD9AF;border-radius:12px;
    padding:14px 18px;margin:0 0 16px;font-size:14px;color:#8A5E11}
  .perime[hidden]{display:none}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty h2{font-family:var(--f-ui);font-size:19px;color:var(--ink);margin:0 0 6px}
  .empty p{margin:0;font-size:14px}

  footer{position:fixed;left:var(--rail);right:0;bottom:0;padding:9px 26px;
    display:flex;gap:16px;align-items:center;font-family:var(--f-data);font-size:11px;
    color:var(--muted);background:rgba(238,242,240,.92);backdrop-filter:blur(8px);
    border-top:1px solid var(--rule)}
  footer kbd{background:#E3E9E6;border-radius:4px;padding:1px 5px}
  /* Sur un écran tactile sans clavier, annoncer des raccourcis est un mensonge
     poli qui prend une ligne : on ne garde que le décompte. */
  @media (hover: none) and (pointer: coarse){
    footer span:not(#foot-count){display:none}
    #foot-count{margin-left:0}
  }

  @media (max-width:720px){
    :root{--rail:34px}
    .roles button span.lbl{display:none}
    .stats{width:100%;margin-left:0;text-align:left;justify-content:space-between}
    main{padding-right:16px;padding-left:calc(var(--rail) + 16px)}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  /* console servie : identité du relecteur et état d'enregistrement */
  .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);
       font-family:var(--f-data)}
  .who[hidden]{display:none}          /* sinon display:flex l'emporte sur [hidden] */
  .export[hidden]{display:none}
  .who b{font-family:var(--f-ui);font-weight:600;color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pine)}
  .dot.wait{background:var(--amber)}
  .dot.err{background:#B4423A}
  .who button{background:none;border:0;color:var(--muted);cursor:pointer;
              font:inherit;text-decoration:underline;padding:0}
  .veil{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;
        z-index:20}
  .veil form{background:var(--card);padding:30px 32px;border-radius:14px;
             box-shadow:var(--shadow);max-width:390px}
  .veil h2{font-size:20px;margin:0 0 6px}
  .veil p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.5}
  .veil input{width:100%;font:inherit;padding:10px 12px;border:1px solid #D3DCD8;
              border-radius:8px;margin-bottom:14px}
  .veil button{background:var(--pine);color:#fff;border:0;border-radius:8px;
               padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<header>
  <div class="brand"><b>Review</b><span id="project"></span></div>
  <nav class="roles" id="roles" aria-label="Review queue"></nav>
  <button class="export" id="export" disabled>Export decisions</button>
  <div class="who" id="who" hidden>
    <span class="dot" id="dot"></span><span id="sync">enregistré</span>
    · <b id="me"></b> <button id="rename" title="Not you?">change</button>
  </div>
</header>

<aside class="rail" aria-label="Progress through the book">
  <div class="rail-cap">BOOK</div>
  <div class="edge" id="edge"></div>
  <div class="rail-pct" id="pct">0%</div>
</aside>

<main>
  <div class="lede">
    <div>
      <h1 id="qtitle"></h1>
      <p id="qdesc"></p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <p id="ids-perimes" class="perime" hidden>This book was built with an older
    numbering, so earlier decisions may show as untouched. Ask whoever sent you
    the link to rebuild it — nothing is lost.</p>
  <div id="list"></div>
</main>

<footer>
  <span><kbd>J</kbd> <kbd>K</kbd> move</span>
  <span><kbd>A</kbd> keep</span>
  <span><kbd>C</kbd> fix</span>
  <span><kbd>S</kbd> skip</span>
  <span id="foot-remove" hidden><kbd>X</kbd> remove</span>
  <span id="foot-count" style="margin-left:auto"></span>
</footer>

<script type="application/json" id="bundle">__BUNDLE__</script>
<script>
/* Deux modes. Fichier autonome produit par run.sh : le bundle est inliné, les
   décisions restent locales et s'exportent. Console servie par le serveur : le
   bundle vaut null, la page va chercher sa file et enregistre chaque décision
   côté serveur, ce qui permet à plusieurs relecteurs de travailler ensemble. */
const INLINE = JSON.parse(document.getElementById('bundle').textContent);
const SERVED = INLINE === null;
let DATA = INLINE;
const QUEUES = {
  teacher: {label:'Teacher', title:'Language to check',
    desc:"Pronunciations that do not match the writing. Each card stands alone — keep it or fix it, without reading the book."},
  editor: {label:'Editor', title:'Exercises to settle',
    desc:"Exercises whose number of answers does not match the number of questions found."},
  vocab: {label:'Vocabulary', title:'Progression to approve',
    desc:"The vocabulary proposed for each lesson, before the book is written. Keep it, fix the pronunciation or meaning, or remove what people do not actually say."},
  manager: {label:'Manager', title:'Answer keys to settle',
    desc:"Differences between the lesson titles and the hand-written answer key. The published answer key is rebuilt from the exercises."}
};
const state = {role:'teacher', decisions:{}, current:null, me:'', attente:{}};

/* ---------- rail ---------- */
const edge = document.getElementById('edge');
function buildRail(){
  edge.innerHTML = '';
  DATA.lessons.forEach(l => {
    const d = document.createElement('div');
    d.className = 'leaf'; d.dataset.lesson = l.id;
    d.title = l.title;
    edge.appendChild(d);
  });
}
function paintRail(){
  const flagged = new Set(), cleared = new Set();
  DATA.items.forEach(i => {
    if (i.lesson_id == null) return;
    (state.decisions[i.id] ? cleared : flagged).add(String(i.lesson_id));
  });
  edge.querySelectorAll('.leaf').forEach(el => {
    const id = el.dataset.lesson;
    el.classList.toggle('flagged', flagged.has(id));
    el.classList.toggle('cleared', !flagged.has(id) && cleared.has(id));
  });
  const done = Object.keys(state.decisions).length;
  document.getElementById('pct').textContent =
    Math.round(done / DATA.items.length * 100) + '%';
}

/* ---------- rôles ---------- */
const rolesEl = document.getElementById('roles');
function paintRoles(){
  rolesEl.innerHTML = '';
  Object.entries(QUEUES).filter(([key]) => !SERVED || key === state.role)
    .forEach(([key, q]) => {
    const total = DATA.items.filter(i => i.queue === key).length;
    const left = DATA.items.filter(i => i.queue === key && !state.decisions[i.id]).length;
    const b = document.createElement('button');
    b.setAttribute('aria-pressed', state.role === key);
    b.innerHTML = `<span class="lbl">${q.label}</span>
      <span class="n${left ? '' : ' done'}">${left ? left : '✓'}</span>`;
    b.title = `${q.label} — ${left} sur ${total} à traiter`;
    b.onclick = () => { state.role = key; render(); };
    rolesEl.appendChild(b);
  });
}

/* ---------- fiches ---------- */
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function cardHTML(it){
  const d = state.decisions[it.id];
  let body = '';
  if (it.kind === 'pinyin'){
    body = `
      <p class="zh">${esc(it.zh)}</p>
      <dl class="rows">
        <dt>WRITTEN</dt><dd class="given">${esc(it.pinyin)}</dd>
        <dt>EXPECTED</dt><dd class="expected">${esc(it.expected)}</dd>
      </dl>
      ${it.context ? `<p class="ctx">${esc(it.context)}</p>` : ''}`;
  } else if (it.kind === 'vocabulaire'){
    body = `
      <!-- Replis : le titre porte déjà l'écriture. Une carte qui demande
           d'approuver un mot sans montrer le mot est pire qu'une carte absente. -->
      <p class="zh">${esc(it.ecriture || it.title)}</p>
      <dl class="rows">
        <dt>PRONUNCIATION</dt><dd class="given">${esc(it.prononciation || '—')}</dd>
        <dt>MEANING</dt><dd class="expected">${esc(it.sens || it.detail || '—')}</dd>
      </dl>`;
  } else if (it.kind === 'exercise'){
    body = `<p class="detail">${esc(it.detail)}</p>
      ${it.items?.length ? `<div class="chips">${it.items.map(q =>
        `<span class="chip">${esc(q)}</span>`).join('')}</div>` : ''}
      ${it.answers?.length ? `<dl class="rows"><dt>ANSWERS</dt>
        <dd>${it.answers.map(esc).join(' · ')}</dd></dl>` : ''}`;
  } else {
    body = `<p class="zh" style="font-family:var(--f-ui);font-size:19px;font-weight:700">${esc(it.title)}</p>
      <p class="detail">${esc(it.detail)}</p>`;
  }
  const verdict = d ? (d.action === 'fix' ? `fixed to “${esc(d.value)}”`
      : d.action === 'skip' ? 'skipped'
      : d.action === 'drop' ? 'removed' : 'kept') : '';
  return `
  <article class="card" data-id="${it.id}" data-state="${d ? 'done' : 'open'}">
    <div class="card-top">
      <span class="tag ${it.kind === 'pinyin' ? '' : 'warn'}">${
        it.kind === 'pinyin' ? 'PRONUNCIATION' : it.kind === 'exercise' ? 'EXERCISE'
      : it.kind === 'vocabulaire' ? 'VOCABULARY' : 'ANSWER KEY'}</span>
      <span class="where">${esc(it.lesson || '—')}${it.kind === 'exercise' ? ' · ' + esc(it.title) : ''}</span>
      <span class="verdict">✓ ${verdict}</span>
    </div>
    <div class="card-body">
      ${body}
      <div class="actions">
        <button class="act primary" data-act="ok">Keep<kbd>A</kbd></button>
        <button class="act" data-act="fix">Fix<kbd>C</kbd></button>
        <button class="act" data-act="skip">Skip<kbd>S</kbd></button>
        ${it.kind === 'vocabulaire'
          ? '<button class="act" data-act="drop">Remove<kbd>X</kbd></button>' : ''}
      </div>
      <div class="fix">
        <input type="text" placeholder="${it.kind === 'pinyin'
          ? 'Correct pronunciation' : it.kind === 'vocabulaire'
          ? 'Corrected pronunciation or meaning' : 'What it should say'}"
          value="${esc(d?.value || (it.kind === 'pinyin' ? it.expected : ''))}">
        <button class="act primary" data-act="save">Save</button>
      </div>
    </div>
  </article>`;
}

function visible(){ return DATA.items.filter(i => i.queue === state.role); }

/* Les compteurs, le rail et les pastilles : tout ce qui change à chaque
   décision sans que la liste ait besoin d'être reconstruite. */
function majCompteurs(){
  const items = visible();
  const left = items.filter(i => !state.decisions[i.id]).length;
  const chiffres = [[left, 'to review'],
                    [DATA.stats.lessons, 'lessons'],
                    [DATA.stats.exercises, 'exercises'],
                    [DATA.stats.pairs_checked, 'pairs checked']];
  document.getElementById('stats').innerHTML = chiffres
    .filter(([v], i) => i === 0 || v)
    .map(([v, l]) => `<div><b>${v}</b>${l}</div>`).join('');
  paintRoles(); paintRail();
  document.getElementById('export').disabled = !Object.keys(state.decisions).length;
  document.getElementById('foot-count').textContent =
    `${Object.keys(state.decisions).length} / ${DATA.items.length} done`;
  document.getElementById('foot-remove').hidden =
    !DATA.items.some(i => i.kind === 'vocabulaire');
  majBandeFin(items, left);
}

/* La bande « vous avez fini » apparaît et disparaît seule. */
function majBandeFin(items, restants){
  const existante = document.querySelector('.fini');
  if (items.length && !restants){
    if (!existante)
      document.getElementById('list').insertAdjacentHTML('afterbegin',
        `<div class="fini"><h2>That is everything</h2>
         <p>All ${items.length} items are settled and saved. You can close this page —
            whoever sent you the link can see your decisions.</p></div>`);
  } else if (existante) existante.remove();
}

function render(){
  const q = QUEUES[state.role];
  document.getElementById('qtitle').textContent = q.title;
  document.getElementById('qdesc').textContent = q.desc;
  const items = visible();
  const left = items.filter(i => !state.decisions[i.id]).length;

  const chiffres = [[left, 'to review'],
                    [DATA.stats.lessons, 'lessons'],
                    [DATA.stats.exercises, 'exercises'],
                    [DATA.stats.pairs_checked, 'pairs checked']];
  document.getElementById('stats').innerHTML = chiffres
    .filter(([v], i) => i === 0 || v)      // un zéro n'apprend rien
    .map(([v, l]) => `<div><b>${v}</b>${l}</div>`).join('');

  // Un livre construit sous un ancien calcul d'identifiants : les décisions
  // existent toujours mais ne se rattachent plus aux items. Le dire, plutôt que
  // de laisser le professeur refaire son travail sans savoir pourquoi.
  const perime = document.getElementById('ids-perimes');
  if (perime) perime.hidden = !DATA.ids_perimes;

  const list = document.getElementById('list');
  list.innerHTML = items.length
    ? items.map(cardHTML).join('')
    : `<div class="empty"><h2>Nothing to review here</h2>
       <p>This queue is empty — the automatic checks found nothing.</p></div>`;
  majBandeFin(items, left);
  if (!items.length) state.current = null;
  else if (!items.some(i => i.id === state.current)) {
    const nx = items.find(i => !state.decisions[i.id]);
    state.current = (nx || items[0]).id;
  }
  markCurrent(false);
  paintRoles(); paintRail();
  document.getElementById('export').disabled = !Object.keys(state.decisions).length;
  document.getElementById('foot-count').textContent =
    `${Object.keys(state.decisions).length} / ${DATA.items.length} done`;
  // « X remove » ne s'affiche que là où la touche agit : une file de
  // prononciation n'a pas d'entrée à écarter, et promettre un raccourci qui ne
  // fait rien coûte plus cher qu'il ne rapporte.
  document.getElementById('foot-remove').hidden =
    !DATA.items.some(i => i.kind === 'vocabulaire');
}

function markCurrent(scroll = true){
  document.querySelectorAll('.card').forEach(c =>
    c.classList.toggle('current', c.dataset.id === state.current));
  if (scroll){
    const el = document.querySelector('.card.current');
    // Sans animation : un relecteur qui enchaîne les touches relance un
    // défilement lisse avant que le précédent ait fini, et chacun annule le
    // suivant — la carte courante finissait hors écran, à 3 000 pixels.
    if (el) el.scrollIntoView({block: 'center', behavior: 'auto'});
  }
}

function decide(id, action, value){
  state.decisions[id] = {action, value: value || '', at: new Date().toISOString(),
                         by: state.me};
  if (SERVED) enregistrer(id);
  const items = visible();
  const idx = items.findIndex(i => i.id === id);
  const nxt = items.slice(idx + 1).find(i => !state.decisions[i.id]);

  // On ne redessine que la carte tranchée. Reconstruire la file entière coûtait
  // 75 ms par touche sur une progression de 465 entrées — et c'est justement la
  // file la plus longue, celle que le professeur vide touche après touche.
  const carte = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  const it = items[idx] || DATA.items.find(i => i.id === id);
  if (carte && it) carte.outerHTML = cardHTML(it);
  else render();
  majCompteurs();
  if (nxt){ state.current = nxt.id; markCurrent(); }
  else markCurrent(false);
}

/* ---------- interactions ---------- */
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  const card = e.target.closest('.card');
  if (!card) return;
  state.current = card.dataset.id;
  if (!btn){ markCurrent(false); return; }
  const id = card.dataset.id;
  if (btn.dataset.act === 'fix'){
    ouvrirCorrection(card);
  } else if (btn.dataset.act === 'save'){
    decide(id, 'fix', card.querySelector('.fix input').value.trim());
  } else {
    decide(id, btn.dataset.act);
  }
});

/* Ouvre le champ de correction ET l'amène à l'écran. Sans le second point, il
   s'ouvrait sous la barre fixe du bas : le relecteur tapait sa correction sans
   voir ce qu'il écrivait. */
function ouvrirCorrection(card){
  const box = card?.querySelector('.fix');
  if (!box) return;
  box.classList.add('open');
  // `focus()` défile de lui-même, et ce défilement-là annulait l'animation
  // suivante : le champ restait sous la barre du bas. On lui demande donc de ne
  // pas bouger la page, puis on la place nous-mêmes.
  const champ = box.querySelector('input');
  champ.focus({preventScroll: true});
  // La boîte vient de passer de `display:none` à visible : on force le calcul
  // de la mise en page avant de mesurer, sinon on défile vers une position
  // périmée. Et sans animation — le défilement lisse démarré dans la même
  // frame qu'un changement de disposition se fait annuler, et le champ
  // retombait sous la barre du bas.
  void box.offsetHeight;
  box.scrollIntoView({block: 'center', behavior: 'auto'});
}

document.addEventListener('keydown', e => {
  if (document.querySelector('.veil')) return;
  if (e.target.tagName === 'INPUT'){
    if (e.key === 'Enter'){
      const card = e.target.closest('.card');
      decide(card.dataset.id, 'fix', e.target.value.trim());
    }
    if (e.key === 'Escape') e.target.closest('.fix').classList.remove('open');
    return;
  }
  const items = visible();
  const idx = items.findIndex(i => i.id === state.current);
  if (e.key === 'j' || e.key === 'ArrowDown'){
    e.preventDefault();
    state.current = items[Math.min(idx + 1, items.length - 1)]?.id || state.current;
    markCurrent();
  } else if (e.key === 'k' || e.key === 'ArrowUp'){
    e.preventDefault();
    state.current = items[Math.max(idx - 1, 0)]?.id || state.current;
    markCurrent();
  } else if (state.current){
    if (e.key === 'a') decide(state.current, 'ok');
    else if (e.key === 's') decide(state.current, 'skip');
    else if (e.key === 'x'){
      // écarter n'a de sens que pour une entrée de vocabulaire proposée
      const it = DATA.items.find(i => i.id === state.current);
      if (it && it.kind === 'vocabulaire') decide(state.current, 'drop');
    }
    else if (e.key === 'c'){
      e.preventDefault();
      ouvrirCorrection(document.querySelector('.card.current'));
    }
  }
});

document.getElementById('export').onclick = () => {
  const out = {
    project: DATA.project, source: DATA.source,
    exported_at: new Date().toISOString(),
    decisions: DATA.items.filter(i => state.decisions[i.id]).map(i => ({
      id: i.id, kind: i.kind, lesson: i.lesson,
      original: i.pinyin || i.title, ...state.decisions[i.id]
    }))
  };
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'decisions.json';
  a.click(); URL.revokeObjectURL(a.href);
};

/* ---------- console servie : enregistrement et travail à plusieurs ---------- */
const lget = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

function setSync(etat){
  document.getElementById('dot').className =
    'dot' + (etat === 'ok' ? '' : etat === 'wait' ? ' wait' : ' err');
  document.getElementById('sync').textContent =
    {ok:'saved', wait:'saving…', err:'offline — retrying'}[etat];
}

function memoAttente(){
  lset('wb_attente_' + DATA.project_id, JSON.stringify(state.attente));
}

/* Écriture optimiste : la décision est déjà affichée et gardée en local ; si le
   réseau tombe, elle est rejouée. Une coupure ne coûte pas la session. */
function enregistrer(id){
  const d = state.decisions[id];
  state.attente[id] = d;
  memoAttente(); setSync('wait');
  fetch('decisions', {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(Object.assign({item_id:id}, d))})
    .then(r => { if (!r.ok) throw new Error(r.status);
                 delete state.attente[id]; memoAttente();
                 setSync(Object.keys(state.attente).length ? 'wait' : 'ok'); })
    .catch(() => setSync('err'));
}

function rafraichir(){
  Object.keys(state.attente).forEach(enregistrer);
  fetch('decisions').then(r => r.json()).then(serveur => {
    let change = false;
    Object.entries(serveur).forEach(([id, d]) => {
      if (state.attente[id]) return;               // notre écriture en cours prime
      const a = state.decisions[id];
      if (!a || a.at !== d.at || a.action !== d.action){
        state.decisions[id] = d; change = true;
      }
    });
    if (change) render();
  }).catch(() => {});
}

function afficherMoi(){ document.getElementById('me').textContent = state.me; }

/* Pas de compte : un prénom, demandé une fois, pour que le manager sache qui a
   tranché quoi et que deux éditeurs ne refassent pas le même travail. */
function identifier(suite){
  state.me = lget('wb_me') || '';
  if (state.me) return suite();
  const veil = document.createElement('div');
  veil.className = 'veil';
  veil.innerHTML = `<form><h2>Your first name</h2>
    <p>Nothing to create, nothing to install. Your name is only used to show who
       decided what, so that several reviewers can work through the same queue
       without stepping on each other.</p>
    <input id="nom" autocomplete="given-name" placeholder="Alex" required>
    <button>Start</button></form>`;
  document.body.appendChild(veil);
  veil.querySelector('input').focus();
  veil.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const v = veil.querySelector('input').value.trim();
    if (!v) return;
    state.me = v; lset('wb_me', v); veil.remove(); suite();
  };
}

function premiereFilePleine(){
  // S'ouvrir sur une file vide donne l'impression que l'outil n'a rien trouvé.
  const avec = Object.keys(QUEUES).filter(k => DATA.items.some(i => i.queue === k));
  return avec.includes(state.role) ? state.role : (avec[0] || state.role);
}

function demarrer(){
  afficherMoi();
  state.role = premiereFilePleine();
  document.getElementById('project').textContent = `${DATA.project} · ${DATA.source}`;
  buildRail();
  render();
  if (SERVED){
    Object.keys(state.attente).forEach(enregistrer);
    setInterval(rafraichir, 5000);
    window.addEventListener('online', rafraichir);
  }
}

document.getElementById('rename').onclick = () => {
  lset('wb_me', ''); identifier(afficherMoi);
};

if (!SERVED){
  document.getElementById('project').textContent = `${DATA.project} · ${DATA.source}`;
  state.role = premiereFilePleine();
  buildRail();
  render();
} else {
  document.getElementById('export').hidden = true;
  document.getElementById('who').hidden = false;
  setSync('ok');
  fetch('bundle.json')
    .then(r => r.ok ? r.json()
      : r.json().then(j => Promise.reject({...j, expire: r.status === 403})))
    .then(b => {
      DATA = b;
      state.role = b.role;
      state.attente = JSON.parse(lget('wb_attente_' + b.project_id) || '{}');
      Object.assign(state.decisions, state.attente);
      return fetch('decisions').then(r => r.json());
    })
    .then(serveur => {
      Object.entries(serveur).forEach(([id, d]) => {
        if (!state.attente[id]) state.decisions[id] = d;
      });
      identifier(demarrer);
    })
    .catch(j => {
      // Un livre en cours de compilation et un lien périmé ne se disent pas
      // pareil : le premier demande d'attendre, le second de redemander un lien.
      const perime = j && j.expire;
      // Trois situations, trois messages. Un livre dont la compilation a échoué
      // affichait « en cours de construction » et rechargeait indéfiniment : le
      // professeur attendait une file qui n'arriverait jamais.
      const rate = !perime && j && j.status === 'failed';
      const etape = ((j && j.step) || '').match(/^(\d+)\s*\/\s*(\d+)/);
      const avance = etape ? `Step ${etape[1]} of ${etape[2]}.` : '';
      const titre = perime ? 'This link no longer works'
                  : rate ? 'This book could not be built'
                  : 'The book is still being built';
      const texte = perime
        ? 'It may have been replaced by a new one. Ask whoever sent it to you for a fresh link.'
        : rate
        ? 'Nothing to do on your side — tell whoever sent you this link, they can see why and start it again.'
        : `${avance} It usually takes a few seconds — this page will open on its own.`;
      document.body.innerHTML =
        `<div class="veil"><form><h2>${titre}</h2><p>${texte}</p></form></div>`;
      if (!perime && !rate) setTimeout(() => location.reload(), 5000);
    });
}
</script>
